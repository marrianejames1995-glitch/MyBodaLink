<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16a34a"/>
      <stop offset="1" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- "Link" network: connecting nodes that tie the three roles together -->
  <g stroke="#bbf7d0" stroke-width="7" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="150" x2="140" y2="232"/>
    <line x1="256" y1="150" x2="372" y2="232"/>
    <line x1="140" y1="232" x2="372" y2="232"/>
  </g>
  <g fill="#bbf7d0">
    <circle cx="256" cy="150" r="15"/>
    <circle cx="140" cy="232" r="11"/>
    <circle cx="372" cy="232" r="11"/>
  </g>

  <!-- CLIENT (top center): a person -->
  <g fill="#ffffff">
    <circle cx="256" cy="96" r="22"/>
    <path d="M214 150 Q256 110 298 150 L298 168 Q256 150 214 168 Z"/>
  </g>

  <!-- BODA RIDER (bottom left): motorcycle -->
  <g stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- wheels -->
    <circle cx="120" cy="372" r="46"/>
    <circle cx="392" cy="372" r="46"/>
    <!-- frame: seat -> tank -> front -->
    <path d="M120 322 L230 286 L300 286 Q350 286 392 322"/>
    <!-- handlebar -->
    <path d="M120 322 L96 280"/>
  </g>
  <g fill="#ffffff">
    <circle cx="120" cy="372" r="14"/>
    <circle cx="392" cy="372" r="14"/>
    <!-- rider head + shoulders -->
    <circle cx="232" cy="252" r="17"/>
    <path d="M206 286 Q232 262 258 286 L258 300 Q232 288 206 300 Z"/>
  </g>

  <!-- TAXI (bottom right): car -->
  <g fill="#ffffff">
    <!-- body -->
    <path d="M318 372 H470 V350 Q470 332 452 332 H448 L430 300 Q424 290 412 290 H386 Q374 290 368 300 L350 332 H346 Q328 332 328 350 Z"/>
    <!-- windows -->
    <path d="M362 330 L374 308 Q376 304 380 304 H394 V330 Z" fill="#16a34a"/>
    <path d="M404 304 H410 Q414 304 416 308 L428 330 H404 Z" fill="#16a34a"/>
  </g>
  <g fill="#15803d">
    <!-- wheels -->
    <circle cx="358" cy="384" r="22"/>
    <circle cx="430" cy="384" r="22"/>
  </g>
  <g fill="#bbf7d0">
    <circle cx="358" cy="384" r="9"/>
    <circle cx="430" cy="384" r="9"/>
  </g>
</svg>
